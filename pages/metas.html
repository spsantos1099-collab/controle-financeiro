<!DOCTYPE html>
<html lang="pt-BR" data-tema="claro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metas · Fluxo — Controle financeiro pessoal</title>
  <link rel="icon" href="../assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
  <script src="../js/theme-init.js"></script>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/sidebar.js" defer></script>
</head>
<body data-protegida="true" data-raiz="../">
  <main class="container pagina-app pagina-metas">
    <a class="marca-sistema" href="dashboard.html" aria-label="Fluxo — Controle financeiro pessoal">
      <img src="../assets/fluxo-icon.png" alt="">
      <span><strong>Fluxo</strong><small>Controle financeiro pessoal</small></span>
    </a>

    <div class="topo-app">
      <div>
        <h1 class="topo-app__titulo">Metas</h1>
        <p class="topo-app__subtitulo">Planeje quanto guardar e acompanhe o que realmente foi separado.</p>
      </div>
      <div class="topo-app__usuario" aria-label="Conta do usuário"></div>
    </div>

    <nav class="nav-paginas" aria-label="Navegação principal">
      <a href="dashboard.html">Dashboard</a>
      <a href="receitas.html">Receitas</a>
      <a href="despesas.html">Despesas</a>
      <a href="cartoes.html">Cartões</a>
      <a href="calendario.html">Calendário</a>
      <a href="metas.html" class="ativa">Metas</a>
      <a href="relatorios.html">Relatórios</a>
      <a href="configuracoes.html">Configurações</a>
    </nav>

    <div class="cabecalho-pagina metas-cabecalho">
      <div class="metas-resumo" id="resumoMetas" aria-live="polite"></div>
      <button class="botao-novo" id="botaoNovaMeta" type="button">Nova meta</button>
    </div>

    <section id="listaMetas" class="grade-metas" aria-live="polite"></section>
  </main>

  <script type="module">
    import {
      observarUsuario, observarLista, adicionarRegistro,
      atualizarRegistro, removerRegistro, salvarRegistroComId
    } from "../js/firebase.js";
    import { formatarMoeda, formatarData, formatarMesAno, paraLista, hojeIso, mesAtual, iconeSvg } from "../js/utils.js";
    import { abrirModal, fecharModal, confirmarExclusao } from "../components/modal.js";
    import { mostrarToast } from "../js/app.js";
    import {
      movimentosDaMeta, planejamentosDaMeta, idPlanejamentoMes,
      idMovimentoPlanejado, valorAtualMeta, percentualMeta,
      faltaMeta, previsaoMeta
    } from "../components/metas.js";

    let uidAtual = null;
    let metas = [];

    const listaMetas = document.getElementById("listaMetas");
    const resumoMetas = document.getElementById("resumoMetas");
    const botaoNovaMeta = document.getElementById("botaoNovaMeta");

    function escaparHtml(valor = "") {
      return String(valor)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function renderizarResumo() {
      const totalAlvo = metas.reduce((soma, meta) => soma + (Number(meta.valorMeta) || 0), 0);
      const totalAtual = metas.reduce((soma, meta) => soma + valorAtualMeta(meta), 0);
      const concluidas = metas.filter((meta) => faltaMeta(meta) <= 0).length;
      const planejadoAtual = metas.reduce((soma, meta) => {
        const plano = planejamentosDaMeta(meta).find((item) => item.mesReferencia === mesAtual() && !item.realizado);
        return soma + (Number(plano?.valor) || 0);
      }, 0);

      resumoMetas.innerHTML = `
        <div><span>Guardado</span><strong class="numero">${formatarMoeda(totalAtual)}</strong></div>
        <div><span>Objetivos</span><strong class="numero">${formatarMoeda(totalAlvo)}</strong></div>
        <div><span>Planejado neste mês</span><strong class="numero">${formatarMoeda(planejadoAtual)}</strong></div>
        <div><span>Concluídas</span><strong>${concluidas} de ${metas.length}</strong></div>
      `;
    }

    function historicoHtml(meta) {
      const movimentos = movimentosDaMeta(meta)
        .sort((a, b) => String(b.data || "").localeCompare(String(a.data || "")) || (Number(b.createdAt) - Number(a.createdAt)))
        .slice(0, 6);

      if (!movimentos.length) return "";

      return `
        <details class="meta-historico">
          <summary>Últimas movimentações</summary>
          <div class="meta-historico__lista">
            ${movimentos.map((movimento) => `
              <div class="meta-historico__item">
                <span>${movimento.data ? formatarData(movimento.data) : ""}${movimento.observacao ? ` · ${escaparHtml(movimento.observacao)}` : ""}</span>
                <strong class="numero ${Number(movimento.valor) >= 0 ? "valor-receita" : "valor-despesa"}">${Number(movimento.valor) >= 0 ? "+" : ""}${formatarMoeda(movimento.valor)}</strong>
              </div>
            `).join("")}
          </div>
        </details>
      `;
    }

    function planejamentoHtml(meta) {
      const planos = planejamentosDaMeta(meta);
      return `
        <details class="meta-planejamento" ${planos.length ? "" : "open"}>
          <summary>
            <span>Planejamento mensal</span>
            <small>${planos.length ? `${planos.length} ${planos.length === 1 ? "mês planejado" : "meses planejados"}` : "Defina quanto pretende guardar"}</small>
          </summary>
          <div class="meta-planejamento__conteudo">
            ${planos.length ? `
              <div class="meta-planejamento__lista">
                ${planos.map((plano) => `
                  <div class="meta-planejamento__item ${plano.realizado ? "meta-planejamento__item--realizado" : ""}">
                    <label class="meta-planejamento__check">
                      <input type="checkbox" data-acao="alternar-plano" data-meta="${meta.id}" data-plano="${plano.id}" ${plano.realizado ? "checked" : ""}>
                      <span></span>
                    </label>
                    <div class="meta-planejamento__info">
                      <strong>${formatarMesAno(plano.mesReferencia)}</strong>
                      <small>${plano.realizado ? `Separado em ${formatarData(plano.realizadoEm || plano.dataRealizacao || hojeIso())}` : "Ainda não separado"}</small>
                    </div>
                    <strong class="numero meta-planejamento__valor">${formatarMoeda(plano.valor)}</strong>
                    <div class="meta-planejamento__acoes">
                      <button class="botao-icone" type="button" title="Editar planejamento" data-acao="editar-plano" data-meta="${meta.id}" data-plano="${plano.id}">${iconeSvg("editar")}</button>
                      <button class="botao-icone botao-icone--perigo" type="button" title="Excluir planejamento" data-acao="excluir-plano" data-meta="${meta.id}" data-plano="${plano.id}">${iconeSvg("excluir")}</button>
                    </div>
                  </div>
                `).join("")}
              </div>` : `<p class="meta-planejamento__vazio">Nenhum valor planejado ainda.</p>`}
            <button class="botao-texto meta-planejamento__adicionar" type="button" data-acao="planejar" data-meta="${meta.id}">Planejar um mês</button>
          </div>
        </details>`;
    }

    function renderizarMetas() {
      renderizarResumo();

      if (!metas.length) {
        listaMetas.innerHTML = `
          <div class="estado-vazio metas-vazio">
            <strong>Nenhuma meta cadastrada</strong>
            <span>Crie um objetivo como viagem, reserva de emergência ou uma compra importante.</span>
          </div>`;
        return;
      }

      const ordenadas = [...metas].sort((a, b) => {
        const concluidaA = faltaMeta(a) <= 0 ? 1 : 0;
        const concluidaB = faltaMeta(b) <= 0 ? 1 : 0;
        if (concluidaA !== concluidaB) return concluidaA - concluidaB;
        return String(a.dataLimite || "9999").localeCompare(String(b.dataLimite || "9999"));
      });

      listaMetas.innerHTML = ordenadas.map((meta) => {
        const atual = valorAtualMeta(meta);
        const alvo = Number(meta.valorMeta) || 0;
        const percentual = percentualMeta(meta);
        const falta = faltaMeta(meta);
        const previsao = previsaoMeta(meta);
        const concluida = falta <= 0;

        return `
          <article class="meta-card ${concluida ? "meta-card--concluida" : ""}" data-id="${meta.id}">
            <div class="meta-card__topo">
              <div>
                <div class="meta-card__titulo-linha">
                  <h2>${escaparHtml(meta.nome || "Meta")}</h2>
                  ${concluida ? '<span class="meta-status">Concluída</span>' : ""}
                </div>
                <p>${escaparHtml(meta.observacoes || previsao.texto)}</p>
              </div>
              <div class="meta-card__acoes">
                <button class="botao-icone" type="button" title="Editar meta" data-acao="editar" data-id="${meta.id}">${iconeSvg("editar")}</button>
                <button class="botao-icone botao-icone--perigo" type="button" title="Excluir meta" data-acao="excluir" data-id="${meta.id}">${iconeSvg("excluir")}</button>
              </div>
            </div>

            <div class="meta-card__valores">
              <div><span>Atual</span><strong class="numero">${formatarMoeda(atual)}</strong></div>
              <div><span>Meta</span><strong class="numero">${formatarMoeda(alvo)}</strong></div>
              <div><span>Falta</span><strong class="numero">${formatarMoeda(falta)}</strong></div>
            </div>

            <div class="meta-progresso" aria-label="${Math.round(percentual)}% concluído">
              <div class="meta-progresso__linha">
                <span>${Math.round(percentual)}%</span>
                <span>${escaparHtml(previsao.texto)}</span>
              </div>
              <div class="meta-progresso__trilho"><i style="width:${percentual}%"></i></div>
            </div>

            <div class="meta-card__rodape">
              <button class="botao-secundario botao-secundario--compacto" type="button" data-acao="movimentar" data-id="${meta.id}">${concluida ? "Ajustar valor" : "Adicionar valor"}</button>
              ${meta.dataLimite ? `<span>Prazo ${formatarData(meta.dataLimite)}</span>` : '<span>Sem prazo definido</span>'}
            </div>
            ${planejamentoHtml(meta)}
            ${historicoHtml(meta)}
          </article>
        `;
      }).join("");
    }

    function abrirFormularioMeta(meta = null) {
      const editando = Boolean(meta);
      const overlay = abrirModal(`
        <h3 class="modal-titulo">${editando ? "Editar meta" : "Nova meta"}</h3>
        <p class="modal-texto">Defina o objetivo e, se já tiver algum valor separado antes de usar o Fluxo, informe como valor inicial.</p>
        <form id="formularioMeta">
          <div class="grade-formulario">
            <div class="campo-formulario campo-formulario--largura-total">
              <label for="metaNome">Nome da meta</label>
              <input id="metaNome" type="text" required maxlength="80" value="${escaparHtml(meta?.nome || "")}" placeholder="Ex: Reserva de emergência">
            </div>
            <div class="campo-formulario">
              <label for="metaValor">Valor da meta (R$)</label>
              <input id="metaValor" type="number" step="0.01" min="0.01" required value="${meta?.valorMeta ?? ""}">
            </div>
            <div class="campo-formulario">
              <label for="metaInicial">Já guardado antes (R$)</label>
              <input id="metaInicial" type="number" step="0.01" min="0" value="${meta?.valorInicial ?? "0"}">
            </div>
            <div class="campo-formulario">
              <label for="metaPrazo">Prazo <span class="campo-opcional">opcional</span></label>
              <input id="metaPrazo" type="date" value="${meta?.dataLimite || ""}">
            </div>
            <div class="campo-formulario campo-formulario--largura-total">
              <label for="metaObservacoes">Observação <span class="campo-opcional">opcional</span></label>
              <textarea id="metaObservacoes" maxlength="180" placeholder="Ex: objetivo para dezembro">${escaparHtml(meta?.observacoes || "")}</textarea>
            </div>
          </div>
          <div class="modal-acoes">
            <button class="botao-secundario" type="button" data-fechar-modal>Cancelar</button>
            <button class="botao-primario" style="width:auto" type="submit">Salvar</button>
          </div>
        </form>
      `);

      overlay.querySelector("#formularioMeta").addEventListener("submit", async (evento) => {
        evento.preventDefault();
        const valorMeta = Number(overlay.querySelector("#metaValor").value);
        const valorInicial = Number(overlay.querySelector("#metaInicial").value) || 0;
        if (valorMeta <= 0 || valorInicial < 0) {
          mostrarToast("Confira os valores informados.", "erro");
          return;
        }

        const dados = {
          uid: uidAtual,
          nome: overlay.querySelector("#metaNome").value.trim(),
          valorMeta,
          valorInicial,
          dataLimite: overlay.querySelector("#metaPrazo").value || "",
          observacoes: overlay.querySelector("#metaObservacoes").value.trim(),
          updatedAt: Date.now()
        };

        try {
          if (editando) await atualizarRegistro(uidAtual, "metas", meta.id, dados);
          else await adicionarRegistro(uidAtual, "metas", { ...dados, createdAt: Date.now() });
          fecharModal();
          mostrarToast(editando ? "Meta atualizada." : "Meta criada.", "sucesso");
        } catch (_) {
          mostrarToast("Não foi possível salvar a meta.", "erro");
        }
      });
    }

    function abrirMovimentacao(meta) {
      const atual = valorAtualMeta(meta);
      const overlay = abrirModal(`
        <h3 class="modal-titulo">Movimentar ${escaparHtml(meta.nome)}</h3>
        <p class="modal-texto">Ao adicionar um valor, ele passa a ser considerado reservado e deixa de compor seu saldo disponível naquele mês.</p>
        <form id="formularioMovimentoMeta">
          <div class="grade-formulario">
            <div class="campo-formulario">
              <label for="movimentoTipo">Movimento</label>
              <select id="movimentoTipo">
                <option value="adicionar">Adicionar valor</option>
                <option value="retirar">Retirar valor</option>
              </select>
            </div>
            <div class="campo-formulario">
              <label for="movimentoValor">Valor (R$)</label>
              <input id="movimentoValor" type="number" step="0.01" min="0.01" required>
            </div>
            <div class="campo-formulario">
              <label for="movimentoData">Data</label>
              <input id="movimentoData" type="date" required value="${hojeIso()}">
            </div>
            <div class="campo-formulario campo-formulario--largura-total">
              <label for="movimentoObs">Observação <span class="campo-opcional">opcional</span></label>
              <input id="movimentoObs" type="text" maxlength="100" placeholder="Ex: transferência para a reserva">
            </div>
          </div>
          <div class="modal-acoes">
            <button class="botao-secundario" type="button" data-fechar-modal>Cancelar</button>
            <button class="botao-primario" style="width:auto" type="submit">Registrar</button>
          </div>
        </form>
      `);

      overlay.querySelector("#formularioMovimentoMeta").addEventListener("submit", async (evento) => {
        evento.preventDefault();
        const tipo = overlay.querySelector("#movimentoTipo").value;
        const informado = Number(overlay.querySelector("#movimentoValor").value);
        const valor = tipo === "retirar" ? -informado : informado;
        if (!informado || informado <= 0) return;
        if (tipo === "retirar" && informado > atual) {
          mostrarToast("O valor retirado não pode ser maior que o saldo da meta.", "erro");
          return;
        }

        try {
          await adicionarRegistro(uidAtual, `metas/${meta.id}/movimentos`, {
            valor,
            data: overlay.querySelector("#movimentoData").value,
            observacao: overlay.querySelector("#movimentoObs").value.trim(),
            origem: "manual",
            createdAt: Date.now()
          });
          await atualizarRegistro(uidAtual, "metas", meta.id, { updatedAt: Date.now() });
          fecharModal();
          mostrarToast("Movimentação registrada.", "sucesso");
        } catch (_) {
          mostrarToast("Não foi possível registrar a movimentação.", "erro");
        }
      });
    }

    function abrirPlanejamento(meta, plano = null) {
      const editando = Boolean(plano);
      const overlay = abrirModal(`
        <h3 class="modal-titulo">${editando ? "Editar planejamento" : "Planejar valor mensal"}</h3>
        <p class="modal-texto">Planejar não altera seu saldo. O dinheiro só será reservado quando você marcar que conseguiu separar o valor.</p>
        <form id="formularioPlanejamento">
          <div class="grade-formulario">
            <div class="campo-formulario">
              <label for="planoMes">Mês</label>
              <input id="planoMes" type="month" required value="${plano?.mesReferencia || mesAtual()}" ${plano?.realizado ? "disabled" : ""}>
            </div>
            <div class="campo-formulario">
              <label for="planoValor">Valor planejado (R$)</label>
              <input id="planoValor" type="number" step="0.01" min="0.01" required value="${plano?.valor ?? ""}">
            </div>
          </div>
          ${plano?.realizado ? '<p class="modal-aviso-suave">Esse mês já foi marcado como separado. Para trocar o mês, desmarque primeiro.</p>' : ""}
          <div class="modal-acoes">
            <button class="botao-secundario" type="button" data-fechar-modal>Cancelar</button>
            <button class="botao-primario" style="width:auto" type="submit">Salvar planejamento</button>
          </div>
        </form>
      `);

      overlay.querySelector("#formularioPlanejamento").addEventListener("submit", async (evento) => {
        evento.preventDefault();
        const mes = overlay.querySelector("#planoMes").value || plano?.mesReferencia;
        const valor = Number(overlay.querySelector("#planoValor").value);
        if (!mes || valor <= 0) {
          mostrarToast("Informe um mês e um valor válido.", "erro");
          return;
        }

        const novoId = idPlanejamentoMes(mes);
        const existenteMesmoMes = planejamentosDaMeta(meta).find((item) => item.id === novoId && item.id !== plano?.id);
        if (existenteMesmoMes) {
          mostrarToast("Esse mês já possui um valor planejado nesta meta.", "erro");
          return;
        }

        try {
          if (editando && plano.id !== novoId) {
            await removerRegistro(uidAtual, `metas/${meta.id}/planejamento`, plano.id);
          }

          const dadosPlano = {
            mesReferencia: mes,
            valor,
            realizado: Boolean(plano?.realizado),
            realizadoEm: plano?.realizadoEm || "",
            createdAt: plano?.createdAt || Date.now(),
            updatedAt: Date.now()
          };
          await salvarRegistroComId(uidAtual, `metas/${meta.id}/planejamento`, novoId, dadosPlano);

          if (plano?.realizado) {
            const movimentoId = idMovimentoPlanejado(plano.id);
            await salvarRegistroComId(uidAtual, `metas/${meta.id}/movimentos`, movimentoId, {
              valor,
              data: plano.realizadoEm || hojeIso(),
              observacao: `Planejamento de ${formatarMesAno(mes)}`,
              origem: "planejamento",
              planejamentoId: novoId,
              createdAt: plano.movimentoCreatedAt || Date.now(),
              updatedAt: Date.now()
            });
          }

          await atualizarRegistro(uidAtual, "metas", meta.id, { updatedAt: Date.now() });
          fecharModal();
          mostrarToast("Planejamento salvo.", "sucesso");
        } catch (_) {
          mostrarToast("Não foi possível salvar o planejamento.", "erro");
        }
      });
    }

    async function alternarPlanejamento(meta, plano, realizado) {
      const movimentoId = idMovimentoPlanejado(plano.id);
      try {
        if (realizado) {
          const data = hojeIso();
          await salvarRegistroComId(uidAtual, `metas/${meta.id}/movimentos`, movimentoId, {
            valor: Number(plano.valor) || 0,
            data,
            observacao: `Planejamento de ${formatarMesAno(plano.mesReferencia)}`,
            origem: "planejamento",
            planejamentoId: plano.id,
            createdAt: Date.now(),
            updatedAt: Date.now()
          });
          await atualizarRegistro(uidAtual, `metas/${meta.id}/planejamento`, plano.id, {
            realizado: true,
            realizadoEm: data,
            updatedAt: Date.now()
          });
          mostrarToast("Valor separado e adicionado à meta.", "sucesso");
        } else {
          await removerRegistro(uidAtual, `metas/${meta.id}/movimentos`, movimentoId);
          await atualizarRegistro(uidAtual, `metas/${meta.id}/planejamento`, plano.id, {
            realizado: false,
            realizadoEm: "",
            updatedAt: Date.now()
          });
          mostrarToast("Marcação desfeita. O valor voltou ao saldo disponível.", "sucesso");
        }
        await atualizarRegistro(uidAtual, "metas", meta.id, { updatedAt: Date.now() });
      } catch (_) {
        mostrarToast("Não foi possível atualizar o planejamento.", "erro");
      }
    }

    async function excluirPlanejamento(meta, plano) {
      const confirmou = await confirmarExclusao(`Excluir o planejamento de ${formatarMesAno(plano.mesReferencia)}?`);
      if (!confirmou) return;
      try {
        if (plano.realizado) {
          await removerRegistro(uidAtual, `metas/${meta.id}/movimentos`, idMovimentoPlanejado(plano.id));
        }
        await removerRegistro(uidAtual, `metas/${meta.id}/planejamento`, plano.id);
        await atualizarRegistro(uidAtual, "metas", meta.id, { updatedAt: Date.now() });
        mostrarToast("Planejamento excluído.", "sucesso");
      } catch (_) {
        mostrarToast("Não foi possível excluir o planejamento.", "erro");
      }
    }

    botaoNovaMeta.addEventListener("click", () => abrirFormularioMeta());

    listaMetas.addEventListener("change", async (evento) => {
      const controle = evento.target.closest('[data-acao="alternar-plano"]');
      if (!controle) return;
      const meta = metas.find((item) => item.id === controle.dataset.meta);
      const plano = meta ? planejamentosDaMeta(meta).find((item) => item.id === controle.dataset.plano) : null;
      if (!meta || !plano) return;
      controle.disabled = true;
      await alternarPlanejamento(meta, plano, controle.checked);
    });

    listaMetas.addEventListener("click", async (evento) => {
      const botao = evento.target.closest("[data-acao]");
      if (!botao || botao.matches('input[type="checkbox"]')) return;

      const metaId = botao.dataset.meta || botao.dataset.id;
      const meta = metas.find((item) => item.id === metaId);
      if (!meta) return;

      if (botao.dataset.acao === "editar") abrirFormularioMeta(meta);
      if (botao.dataset.acao === "movimentar") abrirMovimentacao(meta);
      if (botao.dataset.acao === "planejar") abrirPlanejamento(meta);
      if (botao.dataset.acao === "editar-plano") {
        const plano = planejamentosDaMeta(meta).find((item) => item.id === botao.dataset.plano);
        if (plano) abrirPlanejamento(meta, plano);
      }
      if (botao.dataset.acao === "excluir-plano") {
        const plano = planejamentosDaMeta(meta).find((item) => item.id === botao.dataset.plano);
        if (plano) await excluirPlanejamento(meta, plano);
      }
      if (botao.dataset.acao === "excluir") {
        const confirmou = await confirmarExclusao(`Excluir a meta “${meta.nome}” e todo o histórico dela?`);
        if (!confirmou) return;
        try {
          await removerRegistro(uidAtual, "metas", meta.id);
          mostrarToast("Meta excluída.", "sucesso");
        } catch (_) {
          mostrarToast("Não foi possível excluir a meta.", "erro");
        }
      }
    });

    observarUsuario((usuario) => {
      if (!usuario) return;
      uidAtual = usuario.uid;
      observarLista(uidAtual, "metas", (dados) => {
        metas = paraLista(dados);
        renderizarMetas();
      });
    });
  </script>
  <script type="module" src="../js/app.js"></script>
</body>
</html>
