<!DOCTYPE html>
<html lang="pt-BR" data-tema="claro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cartões · Controle Financeiro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-protegida="true" data-raiz="../">

  <main class="container" style="padding-top: var(--esp-6); padding-bottom: var(--esp-7);">

    <div class="topo-app">
      <h1 class="topo-app__titulo" style="border:none; margin:0; padding:0;">Cartões</h1>
      <div class="topo-app__usuario">
        <span>Logado como <strong data-usuario-email style="color: var(--cor-texto);"></strong></span>
        <button data-sair class="botao-sair" type="button">Sair</button>
      </div>
    </div>

    <nav class="nav-paginas">
      <a href="dashboard.html">Dashboard</a>
      <a href="receitas.html">Receitas</a>
      <a href="despesas.html">Despesas</a>
      <a href="cartoes.html" class="ativa">Cartões</a>
      <a href="calendario.html">Calendário</a>
      <a href="metas.html">Metas</a>
      <a href="relatorios.html">Relatórios</a>
      <a href="configuracoes.html">Configurações</a>
    </nav>

    <div class="cabecalho-pagina">
      <div></div>
      <div class="acoes-cabecalho">
        <button class="botao-secundario" id="botaoNovoCartao" type="button">+ Novo cartão</button>
        <button class="botao-novo" id="botaoNovaCompra" type="button">+ Nova compra</button>
      </div>
    </div>

    <!-- ============================================================
         MEUS CARTÕES
         ============================================================ -->
    <h2 class="secao-titulo" style="margin-top: 0;">Meus cartões</h2>
    <div class="grade-cartoes" id="gradeCartoes"></div>

    <!-- Cartões de outras pessoas (só aparece se houver algum) -->
    <div id="secaoTerceiros" hidden>
      <h2 class="secao-titulo">
        Cartões de outras pessoas
        <span class="secao-titulo__aviso">o valor em aberto é o quanto você ainda deve devolver</span>
      </h2>
      <div class="grade-cartoes" id="gradeTerceiros"></div>
    </div>

    <!-- ============================================================
         FATURAS DO MÊS
         ============================================================ -->
    <h2 class="secao-titulo">
      Faturas
      <span class="secao-titulo__aviso">as parcelas caem automaticamente no mês certo</span>
    </h2>

    <div class="seletor-mes">
      <button type="button" id="mesAnterior" title="Mês anterior">◀</button>
      <span class="seletor-mes__mes" id="rotuloMes"></span>
      <button type="button" id="mesSeguinte" title="Próximo mês">▶</button>
    </div>

    <div id="listaFaturas"></div>

    <!-- ============================================================
         COMPRAS LANÇADAS
         ============================================================ -->
    <h2 class="secao-titulo">Compras lançadas</h2>

    <div class="barra-filtros">
      <input type="search" id="campoBusca" placeholder="Pesquisar compra por descrição...">
      <select id="filtroCartao">
        <option value="">Todos os cartões</option>
      </select>
    </div>

    <div id="listaCompras" class="lista-registros"></div>

  </main>

  <datalist id="categoriasDespesa"></datalist>

  <script type="module">
    /* ==================================================================
       PÁGINA DE CARTÕES
       Trabalha com três listas no banco de dados:
         cartoes  -> os cartões cadastrados
         compras  -> cada compra feita no cartão (o "pai")
         parcelas -> as parcelas geradas automaticamente (os "filhos")
       Apagar uma compra apaga as parcelas dela; apagar um cartão apaga
       as compras e as parcelas daquele cartão.
       ================================================================== */

    import {
      observarUsuario, observarLista,
      adicionarRegistro, atualizarRegistro, removerRegistro
    } from "../js/firebase.js";

    import {
      formatarMoeda, formatarData, formatarMesAno,
      paraLista, somarMeses, mesAtual, hojeIso, dataIsoSegura
    } from "../js/utils.js";

    import {
      BANDEIRAS, CORES_CARTAO, ehCartaoDeTerceiro,
      gerarParcelasDaCompra, gerarParcelasRecorrentes, MESES_ANTECIPACAO_ASSINATURA,
      resumirCartao, renderizarCartaoVisual, mesFaturaDaCompra
    } from "../components/cartoes.js";

    import { CATEGORIAS_DESPESA_PADRAO } from "../js/config.js";
    import { abrirModal, fecharModal, confirmarExclusao, confirmarAcao } from "../components/modal.js";
    import { mostrarToast } from "../js/app.js";

    /* ---------------- Estado da tela ---------------- */
    let uidAtual = null;
    let cartoes = [];
    let compras = [];
    let parcelas = [];
    let mesSelecionado = mesAtual();

    const gradeCartoes = document.getElementById("gradeCartoes");
    const gradeTerceiros = document.getElementById("gradeTerceiros");
    const secaoTerceiros = document.getElementById("secaoTerceiros");
    const listaFaturas = document.getElementById("listaFaturas");
    const listaCompras = document.getElementById("listaCompras");
    const rotuloMes = document.getElementById("rotuloMes");
    const campoBusca = document.getElementById("campoBusca");
    const filtroCartao = document.getElementById("filtroCartao");
    const datalistCategorias = document.getElementById("categoriasDespesa");

    datalistCategorias.innerHTML = CATEGORIAS_DESPESA_PADRAO
      .map((c) => `<option value="${c}"></option>`).join("");

    /* ---------------- Botões do topo ---------------- */
    document.getElementById("botaoNovoCartao")
      .addEventListener("click", () => abrirFormularioCartao());

    document.getElementById("botaoNovaCompra")
      .addEventListener("click", () => abrirFormularioCompra());

    document.getElementById("mesAnterior").addEventListener("click", () => {
      mesSelecionado = somarMeses(mesSelecionado, -1);
      renderizarFaturas();
    });

    document.getElementById("mesSeguinte").addEventListener("click", () => {
      mesSelecionado = somarMeses(mesSelecionado, 1);
      renderizarFaturas();
    });

    campoBusca.addEventListener("input", renderizarCompras);
    filtroCartao.addEventListener("change", renderizarCompras);

    /* ==================================================================
       RENDERIZAÇÃO — CARTÕES
       ================================================================== */
    function renderizarCartoes() {
      // Desenha um grupo de cartões (ou nada, se o grupo estiver vazio)
      function desenharGrupo(lista) {
        return [...lista]
          .sort((a, b) => (a.nome || "").localeCompare(b.nome || ""))
          .map((cartao) => {
            const parcelasDoCartao = parcelas.filter((p) => p.cartaoId === cartao.id);
            return renderizarCartaoVisual(cartao, resumirCartao(cartao, parcelasDoCartao));
          })
          .join("");
      }

      const proprios = cartoes.filter((c) => !ehCartaoDeTerceiro(c));
      const deTerceiros = cartoes.filter((c) => ehCartaoDeTerceiro(c));

      gradeCartoes.innerHTML = desenharGrupo(proprios) + `
        <button class="cartao-adicionar" id="botaoAdicionarCartao" type="button">
          <span>+</span>
          <span>Adicionar cartão</span>
        </button>
      `;

      // Cartões de outras pessoas ganham a própria seção, logo abaixo
      if (deTerceiros.length) {
        secaoTerceiros.hidden = false;
        gradeTerceiros.innerHTML = desenharGrupo(deTerceiros);
      } else {
        secaoTerceiros.hidden = true;
        gradeTerceiros.innerHTML = "";
      }

      document.getElementById("botaoAdicionarCartao")
        .addEventListener("click", () => abrirFormularioCartao());

      // Atualiza também o filtro de cartões da lista de compras
      const selecionado = filtroCartao.value;
      filtroCartao.innerHTML = '<option value="">Todos os cartões</option>' +
        cartoes.map((c) => `<option value="${c.id}">${c.nome}</option>`).join("");
      filtroCartao.value = selecionado;
    }

    /* ==================================================================
       RENDERIZAÇÃO — FATURAS DO MÊS SELECIONADO
       ================================================================== */
    function renderizarFaturas() {
      rotuloMes.textContent = formatarMesAno(mesSelecionado);

      if (!cartoes.length) {
        listaFaturas.innerHTML = '<p class="estado-vazio">Cadastre um cartão para ver as faturas aqui.</p>';
        return;
      }

      listaFaturas.innerHTML = cartoes.map((cartao) => {
        const parcelasDaFatura = parcelas
          .filter((p) => p.cartaoId === cartao.id && p.mesFatura === mesSelecionado)
          .sort((a, b) => (a.descricao || "").localeCompare(b.descricao || ""));

        const total = parcelasDaFatura.reduce((soma, p) => soma + (Number(p.valor) || 0), 0);
        const emAberto = parcelasDaFatura
          .filter((p) => !p.pago)
          .reduce((soma, p) => soma + (Number(p.valor) || 0), 0);

        // Cartão sem dia de vencimento informado: a fatura é identificada
        // apenas pelo mês, sem data exata.
        const legendaVencimento = cartao.diaVencimento
          ? `Vence em ${formatarData(dataIsoSegura(mesSelecionado, cartao.diaVencimento))}`
          : (ehCartaoDeTerceiro(cartao)
              ? `Cartão de ${cartao.titular || "outra pessoa"}`
              : "Sem data de vencimento cadastrada");

        const linhas = parcelasDaFatura.length
          ? parcelasDaFatura.map((p) => `
              <div class="linha-parcela ${p.pago ? "linha-parcela--paga" : ""}">
                <div>
                  <div class="linha-parcela__descricao">${p.descricao || "Sem descrição"}</div>
                  <div class="linha-parcela__categoria">${p.categoria || "Sem categoria"}</div>
                </div>
                <span class="chip-parcela ${p.recorrente ? "chip-parcela--assinatura" : ""}">
                  ${p.recorrente ? "↻ assinatura" : `${p.numero}/${p.totalParcelas}`}
                </span>
                <div class="linha-parcela__valor numero">${formatarMoeda(p.valor)}</div>
                <button class="botao-icone" title="${p.pago ? "Marcar como não paga" : "Marcar como paga"}"
                        data-acao="alternar-parcela" data-id="${p.id}">
                  ${p.pago ? "✅" : "⬜"}
                </button>
              </div>
            `).join("")
          : '<p class="estado-vazio">Nenhuma parcela nesta fatura.</p>';

        return `
          <section class="fatura">
            <div class="fatura__cabecalho">
              <div class="fatura__identificacao">
                <span class="fatura__cor" style="background:${cartao.cor || "#0D5C4C"}"></span>
                <div>
                  <div class="fatura__nome">${cartao.nome}</div>
                  <div class="fatura__vencimento">${legendaVencimento}</div>
                </div>
              </div>
              <div style="display:flex; align-items:center; gap: var(--esp-4); flex-wrap: wrap;">
                <span class="fatura__total">${formatarMoeda(total)}</span>
                ${emAberto > 0 ? `
                  <button class="botao-secundario" data-acao="pagar-fatura"
                          data-cartao="${cartao.id}" type="button">${ehCartaoDeTerceiro(cartao) ? "Marcar como acertado" : "Marcar fatura como paga"}</button>
                ` : ""}
              </div>
            </div>
            ${linhas}
          </section>
        `;
      }).join("");
    }

    /* ==================================================================
       RENDERIZAÇÃO — LISTA DE COMPRAS
       ================================================================== */
    function renderizarCompras() {
      const busca = campoBusca.value.trim().toLowerCase();
      const cartaoFiltrado = filtroCartao.value;

      const filtradas = compras
        .filter((c) => !busca || (c.descricao || "").toLowerCase().includes(busca))
        .filter((c) => !cartaoFiltrado || c.cartaoId === cartaoFiltrado)
        .sort((a, b) => (b.data || "").localeCompare(a.data || ""));

      if (!filtradas.length) {
        listaCompras.innerHTML = '<p class="estado-vazio">Nenhuma compra lançada ainda. Clique em "Nova compra" para começar.</p>';
        return;
      }

      const hoje = mesAtual();

      listaCompras.innerHTML = filtradas.map((compra) => {
        const cartao = cartoes.find((c) => c.id === compra.cartaoId);
        const quantidade = Number(compra.quantidadeParcelas) || 1;

        const chip = compra.recorrente
          ? `<span class="chip-parcela chip-parcela--assinatura">↻ Mensal</span>`
          : `<span class="chip-parcela">${quantidade}x</span>`;

        const canceladaEm = compra.recorrente && compra.dataFim
          ? ` · <span class="badge-cancelada">cobrança até ${formatarMesAno(compra.dataFim)}</span>`
          : "";

        const podeCancelar = compra.recorrente && (!compra.dataFim || compra.dataFim >= hoje);

        return `
          <div class="linha-registro">
            <div>
              <div class="linha-registro__descricao">${compra.descricao || "Sem descrição"}</div>
              <div class="linha-registro__categoria">
                ${cartao ? cartao.nome : "Cartão excluído"} · ${compra.categoria || "Sem categoria"}${canceladaEm}
              </div>
            </div>
            <div class="linha-registro__data">${compra.recorrente ? "desde " + formatarData(compra.data) : formatarData(compra.data)}</div>
            <div>${chip}</div>
            <div class="linha-registro__valor numero" style="color: var(--cor-despesa)">
              ${formatarMoeda(compra.valorTotal)}${compra.recorrente ? "<span class=\"linha-registro__por-mes\">/mês</span>" : ""}
            </div>
            <div class="linha-registro__acoes">
              <button class="botao-icone" title="Editar" data-acao="editar-compra" data-id="${compra.id}">✏️</button>
              <button class="botao-icone" title="Duplicar" data-acao="duplicar-compra" data-id="${compra.id}">⧉</button>
              ${podeCancelar ? `<button class="botao-icone" title="Cancelar assinatura" data-acao="cancelar-assinatura" data-id="${compra.id}">🚫</button>` : ""}
              <button class="botao-icone botao-icone--perigo" title="Excluir" data-acao="excluir-compra" data-id="${compra.id}">🗑️</button>
            </div>
          </div>
        `;
      }).join("");
    }

    /* ==================================================================
       CLIQUES (delegação: um único listener para a página inteira)
       ================================================================== */
    document.addEventListener("click", async (evento) => {
      const botao = evento.target.closest("[data-acao]");
      if (!botao || !uidAtual) return;

      const acao = botao.dataset.acao;
      const id = botao.dataset.id;

      /* ----- Cartões ----- */
      if (acao === "editar-cartao") {
        abrirFormularioCartao(cartoes.find((c) => c.id === id));
      }

      if (acao === "excluir-cartao") {
        const cartao = cartoes.find((c) => c.id === id);
        if (!cartao) return;

        const comprasDoCartao = compras.filter((c) => c.cartaoId === id);
        const confirmou = await confirmarExclusao(
          `Excluir o cartão "${cartao.nome}"? Isso também apaga ${comprasDoCartao.length} compra(s) e todas as parcelas dele.`
        );
        if (!confirmou) return;

        try {
          await Promise.all(parcelas.filter((p) => p.cartaoId === id)
            .map((p) => removerRegistro(uidAtual, "parcelas", p.id)));
          await Promise.all(comprasDoCartao
            .map((c) => removerRegistro(uidAtual, "compras", c.id)));
          await removerRegistro(uidAtual, "cartoes", id);
          mostrarToast("Cartão excluído.", "sucesso");
        } catch (erro) {
          mostrarToast("Não foi possível excluir o cartão.", "erro");
        }
      }

      /* ----- Parcelas e faturas ----- */
      if (acao === "alternar-parcela") {
        const parcela = parcelas.find((p) => p.id === id);
        if (!parcela) return;
        await atualizarRegistro(uidAtual, "parcelas", id, {
          pago: !parcela.pago,
          updatedAt: Date.now()
        });
      }

      if (acao === "pagar-fatura") {
        const cartaoId = botao.dataset.cartao;
        const aPagar = parcelas.filter(
          (p) => p.cartaoId === cartaoId && p.mesFatura === mesSelecionado && !p.pago
        );

        const confirmou = await confirmarAcao(
          `Marcar as ${aPagar.length} parcela(s) de ${formatarMesAno(mesSelecionado)} como pagas?`,
          { titulo: "Pagar fatura", rotuloConfirmar: "Marcar como paga" }
        );
        if (!confirmou) return;

        await Promise.all(aPagar.map((p) =>
          atualizarRegistro(uidAtual, "parcelas", p.id, { pago: true, updatedAt: Date.now() })
        ));
        mostrarToast("Fatura marcada como paga!", "sucesso");
      }

      /* ----- Compras ----- */
      if (acao === "editar-compra") {
        abrirFormularioCompra(compras.find((c) => c.id === id));
      }

      if (acao === "duplicar-compra") {
        const original = compras.find((c) => c.id === id);
        const cartao = cartoes.find((c) => c.id === original?.cartaoId);
        if (!original || !cartao) return;

        // Ao duplicar, a cópia nasce sem data de cancelamento, mesmo
        // que a assinatura original já tenha sido cancelada. E, sendo
        // assinatura, começa a cobrar a partir de hoje (não do passado).
        const { id: ignorado, dataFim: cancelamentoAntigo, ...dados } = original;
        const dataDaCopia = dados.recorrente ? hojeIso() : dados.data;
        await salvarCompra({ ...dados, data: dataDaCopia, createdAt: Date.now(), updatedAt: Date.now() }, cartao);
        mostrarToast(dados.recorrente ? "Assinatura duplicada!" : "Compra duplicada, com as parcelas!", "sucesso");
      }

      if (acao === "cancelar-assinatura") {
        const compra = compras.find((c) => c.id === id);
        if (!compra) return;

        const confirmou = await confirmarAcao(
          `A partir de agora, "${compra.descricao}" não vai gerar mais cobranças novas. As cobranças já lançadas (inclusive a deste mês, se já existir) continuam valendo — isso só afeta os meses futuros.`,
          { titulo: "Cancelar assinatura", rotuloConfirmar: "Cancelar assinatura" }
        );
        if (!confirmou) return;

        const dataFim = mesAtual();

        try {
          await atualizarRegistro(uidAtual, "compras", id, { dataFim, updatedAt: Date.now() });

          // Remove só as cobranças futuras que ainda não foram pagas;
          // o que já foi lançado (passado ou já pago) fica intacto.
          const futurasNaoPagas = parcelas.filter(
            (p) => p.compraId === id && !p.pago && p.mesFatura > dataFim
          );
          await Promise.all(futurasNaoPagas.map((p) => removerRegistro(uidAtual, "parcelas", p.id)));

          mostrarToast("Assinatura cancelada.", "sucesso");
        } catch (erro) {
          mostrarToast("Não foi possível cancelar a assinatura.", "erro");
        }
      }

      if (acao === "excluir-compra") {
        const compra = compras.find((c) => c.id === id);
        if (!compra) return;

        const mensagem = compra.recorrente
          ? `Excluir a assinatura "${compra.descricao}"? Todo o histórico de cobranças dela será apagado.`
          : `Excluir a compra "${compra.descricao}"? Todas as parcelas dela serão apagadas.`;

        const confirmou = await confirmarExclusao(mensagem);
        if (!confirmou) return;

        try {
          await removerParcelasDaCompra(id);
          await removerRegistro(uidAtual, "compras", id);
          mostrarToast(compra.recorrente ? "Assinatura excluída." : "Compra excluída.", "sucesso");
        } catch (erro) {
          mostrarToast("Não foi possível excluir.", "erro");
        }
      }
    });

    /* ==================================================================
       FORMULÁRIO — CARTÃO
       ================================================================== */
    function abrirFormularioCartao(cartaoExistente = null) {
      const editando = Boolean(cartaoExistente);
      const c = cartaoExistente || {};
      const corInicial = c.cor || CORES_CARTAO[0];
      let tipoAtual = c.tipo || "proprio";

      const overlay = abrirModal(`
        <h3 class="modal-titulo">${editando ? "Editar cartão" : "Novo cartão"}</h3>

        <!-- Escolha do tipo: muda quais campos aparecem embaixo -->
        <div class="abas-login" id="abasTipoCartao">
          <button type="button" class="aba-login" data-tipo="proprio">Meu cartão</button>
          <button type="button" class="aba-login" data-tipo="terceiro">De outra pessoa</button>
        </div>

        <form id="formularioCartao">
          <div class="grade-formulario">

            <div class="campo-formulario campo-formulario--largura-total">
              <label for="campoNome">Nome do cartão</label>
              <input type="text" id="campoNome" required value="${c.nome || ""}"
                     placeholder="Ex: Nubank Roxinho">
            </div>

            <!-- Só para cartão de outra pessoa -->
            <div class="campo-formulario campo-formulario--largura-total" data-so-terceiro>
              <label for="campoTitular">De quem é o cartão?</label>
              <input type="text" id="campoTitular" value="${c.titular || ""}"
                     placeholder="Ex: Mãe, Ana, Vizinha">
            </div>

            <div class="campo-formulario">
              <label for="campoMelhorDia">
                Melhor dia de compra <span class="rotulo-opcional">opcional</span>
              </label>
              <input type="number" id="campoMelhorDia" min="1" max="31"
                     value="${c.melhorDiaCompra || ""}" placeholder="Ex: 21">
            </div>

            <div class="campo-formulario">
              <label for="campoVencimento">
                Dia do vencimento <span class="rotulo-opcional">opcional</span>
              </label>
              <input type="number" id="campoVencimento" min="1" max="31"
                     value="${c.diaVencimento || ""}" placeholder="Ex: 27">
            </div>

            <div class="campo-formulario campo-formulario--largura-total">
              <label>Cor do cartão</label>
              <div class="paleta-cores" id="paletaCores">
                ${CORES_CARTAO.map((cor) => `
                  <button type="button" data-cor="${cor}" style="background:${cor}"
                          class="${cor === corInicial ? "selecionada" : ""}" title="${cor}"></button>
                `).join("")}
              </div>
            </div>

            <!-- Campos extras, escondidos por padrão e só para cartão próprio -->
            <details class="detalhes-opcionais" data-so-proprio>
              <summary>Mais detalhes (banco, bandeira, limite)</summary>
              <div class="grade-formulario" style="margin-top: var(--esp-4);">
                <div class="campo-formulario">
                  <label for="campoBanco">Banco</label>
                  <input type="text" id="campoBanco" value="${c.banco || ""}" placeholder="Ex: Nubank">
                </div>
                <div class="campo-formulario">
                  <label for="campoBandeira">Bandeira</label>
                  <select id="campoBandeira">
                    ${BANDEIRAS.map((b) => `
                      <option value="${b}" ${c.bandeira === b ? "selected" : ""}>${b || "Não informar"}</option>
                    `).join("")}
                  </select>
                </div>
                <div class="campo-formulario campo-formulario--largura-total">
                  <label for="campoLimite">Limite (R$)</label>
                  <input type="number" id="campoLimite" step="0.01" min="0"
                         value="${c.limite || ""}" placeholder="Deixe vazio para não controlar limite">
                </div>
              </div>
            </details>

            <p class="dica-formulario" id="dicaTipo"></p>
          </div>

          <div class="modal-acoes">
            <button type="button" class="botao-secundario" data-fechar-modal>Cancelar</button>
            <button type="submit" class="botao-primario" style="width:auto;">Salvar</button>
          </div>
        </form>
      `);

      const dicaTipo = overlay.querySelector("#dicaTipo");

      // Mostra/esconde os campos conforme o tipo escolhido
      function aplicarTipo(tipo) {
        tipoAtual = tipo;

        overlay.querySelectorAll("#abasTipoCartao .aba-login").forEach((aba) => {
          aba.classList.toggle("ativa", aba.dataset.tipo === tipo);
        });

        overlay.querySelectorAll("[data-so-terceiro]").forEach((elemento) => {
          elemento.hidden = tipo !== "terceiro";
        });
        overlay.querySelectorAll("[data-so-proprio]").forEach((elemento) => {
          elemento.hidden = tipo !== "proprio";
        });

        dicaTipo.textContent = tipo === "terceiro"
          ? "Só o nome é obrigatório. As datas são opcionais — sem elas, cada compra entra na fatura do próprio mês em que foi feita, como numa planilha."
          : "Só o nome é obrigatório. Informando o melhor dia de compra, o sistema joga cada parcela na fatura certa automaticamente.";
      }

      aplicarTipo(tipoAtual);

      overlay.querySelector("#abasTipoCartao").addEventListener("click", (evento) => {
        const aba = evento.target.closest("[data-tipo]");
        if (aba) aplicarTipo(aba.dataset.tipo);
      });

      // Escolha da cor
      let corEscolhida = corInicial;
      overlay.querySelector("#paletaCores").addEventListener("click", (evento) => {
        const botaoCor = evento.target.closest("[data-cor]");
        if (!botaoCor) return;
        corEscolhida = botaoCor.dataset.cor;
        overlay.querySelectorAll("#paletaCores button")
          .forEach((b) => b.classList.toggle("selecionada", b === botaoCor));
      });

      overlay.querySelector("#formularioCartao").addEventListener("submit", async (evento) => {
        evento.preventDefault();

        const dados = {
          nome: overlay.querySelector("#campoNome").value.trim(),
          tipo: tipoAtual,
          titular: tipoAtual === "terceiro"
            ? overlay.querySelector("#campoTitular").value.trim()
            : "",
          melhorDiaCompra: Number(overlay.querySelector("#campoMelhorDia").value) || 0,
          diaVencimento: Number(overlay.querySelector("#campoVencimento").value) || 0,
          cor: corEscolhida,
          // Campos extras: só existem em cartão próprio
          banco: tipoAtual === "proprio" ? overlay.querySelector("#campoBanco").value.trim() : "",
          bandeira: tipoAtual === "proprio" ? overlay.querySelector("#campoBandeira").value : "",
          limite: tipoAtual === "proprio" ? (Number(overlay.querySelector("#campoLimite").value) || 0) : 0,
          updatedAt: Date.now()
        };

        try {
          if (editando) {
            await atualizarRegistro(uidAtual, "cartoes", cartaoExistente.id, dados);
            mostrarToast("Cartão atualizado!", "sucesso");
          } else {
            await adicionarRegistro(uidAtual, "cartoes", { ...dados, createdAt: Date.now() });
            mostrarToast("Cartão cadastrado!", "sucesso");
          }
          fecharModal();
        } catch (erro) {
          mostrarToast("Não foi possível salvar o cartão.", "erro");
        }
      });
    }

    /* ==================================================================
       FORMULÁRIO — COMPRA (com prévia do parcelamento em tempo real)
       ================================================================== */
    function abrirFormularioCompra(compraExistente = null) {
      if (!cartoes.length) {
        mostrarToast("Cadastre um cartão antes de lançar uma compra.", "erro");
        abrirFormularioCartao();
        return;
      }

      const editando = Boolean(compraExistente);
      const c = compraExistente || {};
      let tipoAtual = c.recorrente ? "recorrente" : "parcelado";

      const overlay = abrirModal(`
        <h3 class="modal-titulo">${editando ? "Editar compra" : "Nova compra no cartão"}</h3>

        <!-- Escolha do tipo: muda o rótulo do valor e quais campos aparecem -->
        <div class="abas-login" id="abasTipoCompra">
          <button type="button" class="aba-login" data-tipo="parcelado">Compra parcelada</button>
          <button type="button" class="aba-login" data-tipo="recorrente">Assinatura mensal</button>
        </div>

        <form id="formularioCompra">
          <div class="grade-formulario">
            <div class="campo-formulario campo-formulario--largura-total">
              <label for="campoCartao">Cartão</label>
              <select id="campoCartao" required>
                ${cartoes.map((cartao) => `
                  <option value="${cartao.id}" ${c.cartaoId === cartao.id ? "selected" : ""}>${cartao.nome}</option>
                `).join("")}
              </select>
            </div>
            <div class="campo-formulario campo-formulario--largura-total">
              <label for="campoDescricao">Descrição</label>
              <input type="text" id="campoDescricao" required value="${c.descricao || ""}"
                     placeholder="Ex: Notebook ou Netflix">
            </div>
            <div class="campo-formulario">
              <label id="rotuloValor" for="campoValorTotal">Valor total (R$)</label>
              <input type="number" id="campoValorTotal" step="0.01" min="0" required value="${c.valorTotal ?? ""}" placeholder="1200.00">
            </div>
            <div class="campo-formulario">
              <label id="rotuloData" for="campoData">Data da compra</label>
              <input type="date" id="campoData" required value="${c.data || hojeIso()}">
            </div>

            <!-- Só para compra parcelada -->
            <div class="campo-formulario" data-so-parcelado>
              <label for="campoQuantidadeParcelas">Número de parcelas</label>
              <input type="number" id="campoQuantidadeParcelas" min="1" max="72" value="${c.quantidadeParcelas ?? 1}">
            </div>
            <div class="campo-formulario" data-so-parcelado>
              <label for="campoParcelaInicial">Parcela atual</label>
              <input type="number" id="campoParcelaInicial" min="1" max="72" value="${c.parcelaInicial ?? 1}">
            </div>

            <div class="campo-formulario campo-formulario--largura-total">
              <label for="campoCategoria">Categoria</label>
              <input type="text" id="campoCategoria" list="categoriasDespesa" value="${c.categoria || ""}" placeholder="Escolha ou digite uma nova">
            </div>
            <div class="campo-formulario campo-formulario--largura-total">
              <label for="campoObservacoes">Observações</label>
              <textarea id="campoObservacoes">${c.observacoes || ""}</textarea>
            </div>

            <div class="previa-parcelas" id="previaParcelas"></div>
          </div>
          <div class="modal-acoes">
            <button type="button" class="botao-secundario" data-fechar-modal>Cancelar</button>
            <button type="submit" class="botao-primario" style="width:auto;">Salvar</button>
          </div>
        </form>
      `);

      const campos = {
        cartao: overlay.querySelector("#campoCartao"),
        valorTotal: overlay.querySelector("#campoValorTotal"),
        data: overlay.querySelector("#campoData"),
        quantidade: overlay.querySelector("#campoQuantidadeParcelas"),
        parcelaInicial: overlay.querySelector("#campoParcelaInicial")
      };
      const previa = overlay.querySelector("#previaParcelas");
      const rotuloValor = overlay.querySelector("#rotuloValor");
      const rotuloData = overlay.querySelector("#rotuloData");

      // Alterna entre "compra parcelada" e "assinatura mensal": muda os
      // rótulos e esconde os campos que não fazem sentido em cada caso
      function aplicarTipo(tipo) {
        tipoAtual = tipo;

        overlay.querySelectorAll("#abasTipoCompra .aba-login").forEach((aba) => {
          aba.classList.toggle("ativa", aba.dataset.tipo === tipo);
        });
        overlay.querySelectorAll("[data-so-parcelado]").forEach((elemento) => {
          elemento.hidden = tipo !== "parcelado";
        });

        rotuloValor.textContent = tipo === "recorrente" ? "Valor cobrado por mês (R$)" : "Valor total (R$)";
        rotuloData.textContent = tipo === "recorrente" ? "Cobrando desde" : "Data da compra";

        atualizarPrevia();
      }

      // Mostra, enquanto o usuário digita, como o sistema vai lançar a compra
      function atualizarPrevia() {
        const cartao = cartoes.find((item) => item.id === campos.cartao.value);
        const valorTotal = Number(campos.valorTotal.value) || 0;

        if (!cartao || !valorTotal || !campos.data.value) {
          previa.textContent = "Preencha o valor e a data para ver como as cobranças serão lançadas.";
          return;
        }

        const primeiraFatura = mesFaturaDaCompra(campos.data.value, cartao.melhorDiaCompra, cartao.diaVencimento);

        if (tipoAtual === "recorrente") {
          previa.innerHTML = `
            <strong>${formatarMoeda(valorTotal)} todo mês</strong><br>
            Começa na fatura de <strong>${formatarMesAno(primeiraFatura)}</strong> e continua
            automaticamente, sem data para acabar — você cancela quando quiser.
          `;
          return;
        }

        const quantidade = Math.max(1, Number(campos.quantidade.value) || 1);
        const inicial = Math.min(Math.max(1, Number(campos.parcelaInicial.value) || 1), quantidade);
        const ultimaFatura = somarMeses(primeiraFatura, quantidade - inicial);
        const restantes = quantidade - inicial + 1;

        previa.innerHTML = `
          <strong>${quantidade}x de ${formatarMoeda(valorTotal / quantidade)}</strong><br>
          ${restantes} parcela(s) serão lançadas, da ${inicial}/${quantidade} até a ${quantidade}/${quantidade}.<br>
          Primeira na fatura de <strong>${formatarMesAno(primeiraFatura)}</strong>,
          última na de <strong>${formatarMesAno(ultimaFatura)}</strong>.
        `;
      }

      overlay.querySelector("#abasTipoCompra").addEventListener("click", (evento) => {
        const aba = evento.target.closest("[data-tipo]");
        if (aba) aplicarTipo(aba.dataset.tipo);
      });

      Object.values(campos).forEach((campo) => {
        campo.addEventListener("input", atualizarPrevia);
        campo.addEventListener("change", atualizarPrevia);
      });
      aplicarTipo(tipoAtual);

      overlay.querySelector("#formularioCompra").addEventListener("submit", async (evento) => {
        evento.preventDefault();

        const cartao = cartoes.find((item) => item.id === campos.cartao.value);
        if (!cartao) {
          mostrarToast("Selecione um cartão válido.", "erro");
          return;
        }

        const dados = {
          cartaoId: cartao.id,
          descricao: overlay.querySelector("#campoDescricao").value.trim(),
          valorTotal: Number(campos.valorTotal.value),
          recorrente: tipoAtual === "recorrente",
          categoria: overlay.querySelector("#campoCategoria").value.trim(),
          data: campos.data.value,
          observacoes: overlay.querySelector("#campoObservacoes").value.trim(),
          updatedAt: Date.now()
        };

        if (tipoAtual === "parcelado") {
          dados.quantidadeParcelas = Math.max(1, Number(campos.quantidade.value) || 1);
          dados.parcelaInicial = Math.max(1, Number(campos.parcelaInicial.value) || 1);
          // Se estava cancelada e virou parcelada, limpa a marcação antiga
          dados.dataFim = null;
        } else {
          dados.quantidadeParcelas = null;
          dados.parcelaInicial = null;
        }

        try {
          if (editando) {
            await atualizarRegistro(uidAtual, "compras", compraExistente.id, dados);

            // Regera as cobranças do zero, preservando as que já estavam pagas
            const antigas = parcelas.filter((p) => p.compraId === compraExistente.id);
            await removerParcelasDaCompra(compraExistente.id);
            await criarParcelas({ ...c, ...dados, id: compraExistente.id }, cartao, antigas);
            mostrarToast("Compra atualizada!", "sucesso");
          } else {
            await salvarCompra({ ...dados, createdAt: Date.now() }, cartao);
            mostrarToast(
              tipoAtual === "recorrente" ? "Assinatura cadastrada!" : "Compra lançada e parcelas criadas!",
              "sucesso"
            );
          }
          fecharModal();
        } catch (erro) {
          mostrarToast("Não foi possível salvar a compra.", "erro");
        }
      });
    }

    /* ==================================================================
       FUNÇÕES AUXILIARES DE BANCO DE DADOS
       ================================================================== */

    // Cria a compra e, logo em seguida, todas as parcelas dela
    async function salvarCompra(dadosCompra, cartao) {
      const compraId = await adicionarRegistro(uidAtual, "compras", dadosCompra);
      await criarParcelas({ ...dadosCompra, id: compraId }, cartao);
    }

    async function criarParcelas(compra, cartao, parcelasAntigas = []) {
      const novasParcelas = compra.recorrente
        ? gerarParcelasRecorrentes(
            compra, cartao,
            somarMeses(mesAtual(), MESES_ANTECIPACAO_ASSINATURA - 1),
            parcelasAntigas
          )
        : gerarParcelasDaCompra(compra, cartao, parcelasAntigas);

      await Promise.all(
        novasParcelas.map((parcela) => adicionarRegistro(uidAtual, "parcelas", parcela))
      );
    }

    /* --------------------------------------------------------------
       COLCHÃO DE MESES DAS ASSINATURAS
       Toda vez que os dados chegam do banco, confere se alguma
       assinatura ativa está "ficando para trás" (a última cobrança já
       gerada está a menos de MESES_ANTECIPACAO_ASSINATURA meses de
       hoje) e completa sozinha os meses que faltam — sem precisar que
       o usuário abra e feche o formulário. Assim a assinatura nunca
       "acaba" sem querer só porque o app ficou muito tempo fechado.
       -------------------------------------------------------------- */
    let sincronizandoAssinaturas = false;

    async function sincronizarAssinaturas() {
      if (sincronizandoAssinaturas || !uidAtual) return;

      const mesLimite = somarMeses(mesAtual(), MESES_ANTECIPACAO_ASSINATURA - 1);

      const pendentes = compras.filter((compra) => {
        if (!compra.recorrente) return false;
        // Já cancelada há tempo: não precisa completar nada
        if (compra.dataFim && compra.dataFim < mesAtual()) return false;

        const cartao = cartoes.find((cartaoItem) => cartaoItem.id === compra.cartaoId);
        if (!cartao) return false;

        const mesesGerados = parcelas.filter((p) => p.compraId === compra.id).map((p) => p.mesFatura);
        const ultimoMesGerado = mesesGerados.length ? mesesGerados.sort().at(-1) : null;
        const alvo = (compra.dataFim && compra.dataFim < mesLimite) ? compra.dataFim : mesLimite;

        return !ultimoMesGerado || ultimoMesGerado < alvo;
      });

      if (!pendentes.length) return;

      sincronizandoAssinaturas = true;
      try {
        for (const compra of pendentes) {
          const cartao = cartoes.find((cartaoItem) => cartaoItem.id === compra.cartaoId);
          const antigas = parcelas.filter((p) => p.compraId === compra.id);
          await removerParcelasDaCompra(compra.id);
          await criarParcelas(compra, cartao, antigas);
        }
      } finally {
        sincronizandoAssinaturas = false;
      }
    }

    async function removerParcelasDaCompra(compraId) {
      await Promise.all(
        parcelas.filter((p) => p.compraId === compraId)
          .map((p) => removerRegistro(uidAtual, "parcelas", p.id))
      );
    }

    /* ==================================================================
       CONEXÃO COM O BANCO (tempo real)
       ================================================================== */
    observarUsuario((usuario) => {
      if (!usuario || uidAtual === usuario.uid) return;
      uidAtual = usuario.uid;

      observarLista(uidAtual, "cartoes", (dados) => {
        cartoes = paraLista(dados);
        renderizarCartoes();
        renderizarFaturas();
        renderizarCompras();
        sincronizarAssinaturas();
      });

      observarLista(uidAtual, "compras", (dados) => {
        compras = paraLista(dados);
        renderizarCompras();
        sincronizarAssinaturas();
      });

      observarLista(uidAtual, "parcelas", (dados) => {
        parcelas = paraLista(dados);
        renderizarCartoes();
        renderizarFaturas();
        sincronizarAssinaturas();
      });
    });

    // Primeira pintura da tela, enquanto os dados ainda não chegaram
    renderizarCartoes();
    renderizarFaturas();
    renderizarCompras();
  </script>

  <script type="module" src="../js/app.js"></script>
</body>
</html>
